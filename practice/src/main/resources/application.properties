spring.application.name=practice
#{
##removed while deployment-----
##spring.config.import=optional:file:./.env[.properties]
#}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# port provided by the render
server.port=${PORT:8080}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
# Show logs from your package only at DEBUG level
logging.level.com.example.practice=DEBUG
# Spring framework logs at INFO only (less noise)
logging.level.org.springframework=INFO
# Save logs to a file as well
logging.file.name=logs/app.log

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.security.cookies.secure=${COOKIE_SECURE:true}
app.security.cookies.same-site=${COOKIE_SAME_SITE:Lax}

# Google OAuth credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

# Redirect after OAuth
app.oauth.success-redirect=${OAUTH_SUCCESS_REDIRECT:http://localhost:3000/dashboard}
app.oauth.failure-redirect=${OAUTH_FAILURE_REDIRECT:http://localhost:3000/login}

# mail config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
