spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=test-only-jwt-secret-for-unit-tests-change-in-production
jwt.expiration=86400000

app.security.cookies.secure=false
app.security.cookies.same-site=Lax

spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost/login/oauth2/code/google

# OAuth redirects for testing
app.oauth.success-redirect=http://localhost:3000/
app.oauth.failure-redirect=http://localhost:3000/login
app.cors.allowed-origins=http://localhost:3000
